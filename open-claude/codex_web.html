<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>硕磐智能 — 本体智能体</title>
<style>
:root{
  --bg:#0f0f10; --panel:#161618; --panel2:#1d1d20; --border:#2a2a2e;
  --text:#ececf1; --dim:#9a9aa6; --dimmer:#6b6b76;
  --accent:#ffffff; --green:#3fb950; --red:#f85149; --amber:#d29922;
  --mono:ui-monospace,SFMono-Regular,Consolas,"Cascadia Mono",Menlo,monospace;
  --sans:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;display:flex;overflow:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;color:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#333338;border-radius:5px}
::-webkit-scrollbar-track{background:transparent}

/* ============ sidebar ============ */
#sidebar{width:264px;min-width:264px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:9px;padding:16px 16px 12px}
.brand .logo{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#3b3b40,#232326);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.brand .name{font-weight:600;font-size:14px}
.brand .tag{font-size:10px;color:var(--dimmer);border:1px solid var(--border);border-radius:4px;padding:1px 5px;margin-left:auto}
#newtask{margin:4px 12px 10px;padding:9px 12px;border:1px solid var(--border);border-radius:9px;background:var(--panel2);display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text)}
#newtask:hover{background:#232327}
.sec{padding:10px 16px 6px;font-size:11px;letter-spacing:.06em;color:var(--dimmer);text-transform:uppercase}
#tasklist{flex:1;overflow-y:auto;padding:0 8px 8px}
.task-row{padding:8px 10px;border-radius:8px;cursor:pointer;display:flex;flex-direction:column;gap:3px;margin-bottom:2px}
.task-row:hover{background:#202024}
.task-row.active{background:#26262b}
.task-row .t{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task-row .m{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--dimmer)}
.dot{width:7px;height:7px;border-radius:50%;background:#4b4b52;flex:none}
.dot.working{background:var(--amber);animation:pulse 1.1s infinite}
.dot.error{background:var(--red)}
@keyframes pulse{50%{opacity:.35}}
.chip{border:1px solid var(--border);border-radius:4px;padding:0 5px;font-size:10px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px}
#sandboxnote{margin-top:auto;flex:none;padding:10px 16px;border-top:1px solid var(--border);font-size:10.5px;color:var(--dimmer);line-height:1.5;word-break:break-all}
#sidebar-settings{margin:8px 12px;padding:9px 12px;border:1px solid var(--border);border-radius:9px;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--dim);text-align:left}
#sidebar-settings:hover{background:#202024;color:var(--text)}
.empty-side{padding:14px 16px;color:var(--dimmer);font-size:12px}

/* ============ main ============ */
#main{flex:1;display:flex;flex-direction:column;min-width:0}

/* home */
#home{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;overflow-y:auto}
#home h1{font-size:26px;font-weight:600;margin-bottom:26px}

/* composer card (shared) */
.composer{width:100%;max-width:720px;background:var(--panel2);border:1px solid var(--border);border-radius:16px;padding:12px 14px 10px}
.composer textarea{width:100%;background:none;border:none;outline:none;resize:none;font-size:14px;line-height:1.55;color:var(--text);max-height:220px;min-height:24px}
.composer textarea::placeholder{color:var(--dimmer)}
.crow{display:flex;flex-wrap:nowrap;align-items:center;gap:8px;margin-top:10px;overflow:visible;min-width:0}
.cbtn{display:flex;flex:none;align-items:center;gap:6px;border:1px solid var(--border);border-radius:8px;padding:5px 10px;font-size:12px;color:var(--dim);background:transparent;white-space:nowrap;min-width:0}
.btn-icon{flex:none}
.crow[data-compact="1"] .compactable[data-compact-level="1"] .btn-label,
.crow[data-compact="2"] .compactable[data-compact-level="1"] .btn-label,
.crow[data-compact="2"] .compactable[data-compact-level="2"] .btn-label,
.crow[data-compact="3"] .compactable[data-compact-level="1"] .btn-label,
.crow[data-compact="3"] .compactable[data-compact-level="2"] .btn-label,
.crow[data-compact="3"] .compactable[data-compact-level="3"] .btn-label,
.crow[data-compact="4"] .compactable[data-compact-level="1"] .btn-label,
.crow[data-compact="4"] .compactable[data-compact-level="2"] .btn-label,
.crow[data-compact="4"] .compactable[data-compact-level="3"] .btn-label,
.crow[data-compact="4"] .compactable[data-compact-level="4"] .btn-label,
.crow[data-compact="5"] .compactable[data-compact-level="1"] .btn-label,
.crow[data-compact="5"] .compactable[data-compact-level="2"] .btn-label,
.crow[data-compact="5"] .compactable[data-compact-level="3"] .btn-label,
.crow[data-compact="5"] .compactable[data-compact-level="4"] .btn-label,
.crow[data-compact="5"] .compactable[data-compact-level="5"] .btn-label,
.crow[data-compact="6"] .compactable[data-compact-level="1"] .btn-label,
.crow[data-compact="6"] .compactable[data-compact-level="2"] .btn-label,
.crow[data-compact="6"] .compactable[data-compact-level="3"] .btn-label,
.crow[data-compact="6"] .compactable[data-compact-level="4"] .btn-label,
.crow[data-compact="6"] .compactable[data-compact-level="5"] .btn-label,
.crow[data-compact="6"] .compactable[data-compact-level="6"] .btn-label{display:none}
.crow[data-compact]:not([data-compact="0"]) .compactable[data-compact-level] .caret{display:none}
.cbtn:hover{background:#26262b;color:var(--text)}
.cbtn .caret{font-size:9px;opacity:.7}
#sendbtn,#sendbtn2{margin-left:auto;width:32px;height:32px;border-radius:50%;background:var(--accent);color:#111;display:flex;align-items:center;justify-content:center;font-size:15px;flex:none;transition:width .15s,border-radius .15s}
#sendbtn.start-mode,#sendbtn2.start-mode{width:auto;min-width:0;padding:0 14px;border-radius:17px;font-size:13px;font-weight:600;white-space:nowrap}
#sendbtn:disabled,#sendbtn2:disabled{opacity:.3;cursor:default}
.model-indicator{width:auto;max-width:150px;height:24px;border:0;border-radius:7px;display:flex;align-items:center;justify-content:center;gap:4px;color:var(--dim);font-size:12px;font-weight:400;line-height:1;flex:none;margin-left:auto;padding:2px 5px;background:transparent;cursor:pointer;overflow:hidden;white-space:nowrap}
.model-indicator .model-short{max-width:112px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.model-indicator .model-caret{font-size:10px;color:var(--dimmer);line-height:1}
.model-indicator + #sendbtn,.model-indicator + #sendbtn2{margin-left:0}
.model-indicator:hover{background:#e5e7eb;color:#475569}

/* dropdown popovers */
.pop{position:fixed;z-index:60;background:#212125;border:1px solid var(--border);border-radius:10px;padding:6px;min-width:210px;max-height:320px;overflow-y:auto;box-shadow:0 12px 32px rgba(0,0,0,.5);display:none}
.pop.open{display:block}
.pop .item{padding:7px 10px;border-radius:7px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:8px}
.pop .item:hover{background:#2c2c31}
.pop .item .chk{width:14px;color:var(--green);flex:none}
.pop .sep{height:1px;background:var(--border);margin:5px 4px}
.pop .head{padding:6px 10px 4px;font-size:11px;color:var(--dimmer)}
.pop .model-param-item{position:sticky;bottom:-6px;margin:0 -6px -6px;padding:9px 16px;background:var(--panel);border-top:1px solid var(--border);border-radius:0 0 9px 9px;color:var(--dim);z-index:1}
.pop .model-param-item:hover{background:#f1f5f9;color:var(--text)}

/* params popover */
.prow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 10px;font-size:12.5px}
.prow label{color:var(--dim)}
.prow input[type=number]{width:84px;background:#141416;border:1px solid var(--border);border-radius:6px;padding:4px 7px;font-size:12px;color:var(--text);outline:none}
.prow input[type=range]{width:110px;accent-color:#8e8ea0}
.prow .val{font-family:var(--mono);font-size:11.5px;color:var(--dim);width:32px;text-align:right}
.prow.off{opacity:.4;pointer-events:none}
.sw{position:relative;width:34px;height:19px;border-radius:10px;background:#3a3a40;transition:.15s;flex:none;cursor:pointer}
.sw.on{background:var(--green)}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#fff;transition:.15s}
.sw.on::after{left:17px}

/* task view */
#taskview{flex:1;display:none;flex-direction:column;min-height:0}
#taskview.empty-task{position:relative}
#taskhead{display:flex;align-items:center;gap:10px;padding:13px 22px;border-bottom:1px solid var(--border)}
#taskhead .title{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#taskhead .spin{display:none;align-items:center;gap:7px;font-size:12px;color:var(--amber)}
#taskhead .spin.on{display:flex}
.spinner{width:12px;height:12px;border:2px solid rgba(210,153,34,.3);border-top-color:var(--amber);border-radius:50%;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
#feed{flex:1;overflow-y:auto;padding:26px 22px 12px}
.feedcol{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
#taskcomposer{padding:10px 22px 18px;display:flex;justify-content:center}
#taskview.empty-task #taskcomposer{position:absolute;left:22px;right:22px;top:50%;padding:0;transform:translateY(-50%)}
#taskview.empty-task #taskcomposer .composer{margin:0 auto}

/* messages */
.msg-user{align-self:flex-end;max-width:78%;background:#26262b;border-radius:14px 14px 4px 14px;padding:9px 14px;white-space:pre-wrap;line-height:1.55}
.msg-asst{line-height:1.65;font-size:14.5px;max-width:100%;overflow-wrap:break-word}
.msg-asst p{margin:0 0 10px}
.msg-asst p:last-child{margin-bottom:0}
.msg-asst h1,.msg-asst h2,.msg-asst h3{margin:14px 0 8px;font-size:1.08em}
.msg-asst ul,.msg-asst ol{margin:0 0 10px 22px}
.msg-asst li{margin:3px 0}
.msg-asst code{font-family:var(--mono);font-size:12.5px;background:#232327;border-radius:4px;padding:1px 5px}
.msg-asst pre{background:#141416;border:1px solid var(--border);border-radius:9px;padding:11px 13px;overflow-x:auto;margin:0 0 10px}
.msg-asst pre code{background:none;padding:0;font-size:12.5px;line-height:1.5}
.msg-asst a{color:#79b8ff}
.msg-err{color:var(--red);background:rgba(248,81,73,.08);border:1px solid rgba(248,81,73,.35);border-radius:9px;padding:9px 13px;font-size:13px}

/* 危险操作确认卡片 */
.appr{border:1px solid rgba(210,153,34,.55);border-radius:10px;background:rgba(210,153,34,.07);padding:11px 14px}
.appr.done{border-color:var(--border);background:var(--panel)}
.appr .ahead{font-size:13px;color:var(--amber);font-weight:600}
.appr.done .ahead{color:var(--dim)}
.appr .adetail{font-family:var(--mono);font-size:12px;background:#141416;border:1px solid var(--border);border-radius:8px;padding:8px 11px;margin:8px 0 0;white-space:pre-wrap;max-height:180px;overflow:auto;color:#c8c8cf}
.appr .abtns{display:flex;gap:8px;margin-top:10px;align-items:center}
.appr .abtns button{border:1px solid var(--border);border-radius:7px;padding:5px 16px;font-size:12.5px}
.appr .abtns .aok{background:var(--green);color:#fff;border-color:transparent;font-weight:600}
.appr .abtns .ano{color:var(--dim)}
.appr .abtns button:hover{filter:brightness(1.15)}
.appr .abtns button:disabled{opacity:.4;cursor:default}
.appr .ast{font-size:12px;color:var(--dimmer)}
.ares{font-size:12.5px;font-weight:600}
.ares.yes{color:var(--green)}
.ares.no{color:var(--red)}

/* 对话中的文件名链接 -> 右侧预览 */
.filelink{color:#79b8ff;cursor:pointer;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px}
.filelink:hover{color:#a5d0ff;text-decoration-style:solid}

/* thinking */
.think{border-left:2px solid var(--border);padding:2px 0 2px 12px;color:var(--dimmer);font-size:12.5px;white-space:pre-wrap;max-height:72px;overflow:hidden;cursor:pointer}
.think.open{max-height:none}

/* 可核验的执行审计摘要（不展示隐藏思维链） */
.audit{border:1px solid var(--border);border-left:3px solid #60a5fa;border-radius:8px;background:var(--panel2);padding:8px 10px;color:var(--dim);font-size:12px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.audit.warning{border-left-color:var(--amber);background:#fffbeb;color:#92400e}
.audit .audit-title{font-weight:600;color:var(--text);margin-right:6px}
.audit.warning .audit-title{color:#92400e}

/* tool cards */
.tool{border:1px solid var(--border);border-radius:10px;background:var(--panel);overflow:hidden}
.tool .thead{display:flex;align-items:center;gap:8px;padding:8px 12px;font-size:12.5px;color:var(--dim);cursor:pointer;user-select:none}
.tool .thead:hover{background:#1c1c1f}
.tool .thead .ic{width:16px;text-align:center;flex:none}
.tool .thead .lbl{color:var(--text)}
.tool .thead .path{font-family:var(--mono);font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tool .thead .st{margin-left:auto;font-size:11px;flex:none}
.tool .thead .st.run{color:var(--amber)}
.tool .thead .st.ok{color:var(--green)}
.tool .thead .st.err{color:var(--red)}
.tool .tbody{display:none;border-top:1px solid var(--border)}
.tool.open .tbody{display:block}
.term{font-family:var(--mono);font-size:12px;line-height:1.55;padding:10px 13px;white-space:pre-wrap;word-break:break-all;max-height:340px;overflow-y:auto;background:#111113}
.term .cmd{color:#8ab4f8}
.term .out{color:#c8c8cf}
.term .errout{color:var(--red)}
.diff{font-family:var(--mono);font-size:12px;line-height:1.5;max-height:340px;overflow:auto;background:#111113;padding:8px 0}
.diff .ln{padding:0 13px;white-space:pre-wrap;word-break:break-all}
.diff .add{background:rgba(63,185,80,.12);color:#7ee787}
.diff .del{background:rgba(248,81,73,.10);color:#ffa198}

.done-note{font-size:11.5px;color:var(--dimmer);text-align:center;padding:2px 0}

/* attach chips */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips:empty{display:none}
.fchip{display:flex;align-items:center;gap:6px;border:1px solid var(--border);background:#232327;border-radius:7px;padding:3px 8px;font-size:12px;color:var(--dim)}
.fchip b{color:var(--text);font-weight:500;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fchip .x{cursor:pointer;color:var(--dimmer)}
.fchip .x:hover{color:var(--red)}

/* right preview panel */
#preview{width:46%;min-width:380px;border-left:1px solid var(--border);display:none;flex-direction:column;background:var(--panel)}
#preview.open{display:flex}
#pvhead{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border);font-size:13px}
#pvtitle{font-family:var(--mono);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.pvbtn{border:1px solid var(--border);border-radius:6px;padding:3px 9px;font-size:12px;color:var(--dim);background:transparent;flex:none}
.pvbtn:hover{color:var(--text);background:#26262b}
.pvbtn.on{color:#0b0b0c;background:var(--amber);border-color:var(--amber);font-weight:600}
.pvbtn.on:hover{background:var(--amber)}
.cbtn.auto-btn.on{color:#0b0b0c;background:var(--amber);border-color:var(--amber);font-weight:600}
.cbtn.auto-btn.on:hover{background:var(--amber);color:#0b0b0c}
#pvbody{flex:1;overflow:auto;min-height:0;display:flex;flex-direction:column}
.pv-code{font-family:var(--mono);font-size:12px;line-height:1.55;padding:12px 14px;white-space:pre;color:#c8c8cf}
.pv-code .no{color:var(--dimmer);user-select:none;display:inline-block;width:3.2em;text-align:right;margin-right:12px}
.pv-table-wrap{padding:12px 14px;overflow:auto}
.pv-table{border-collapse:collapse;font-size:12.5px;font-family:var(--mono);white-space:nowrap}
.pv-table th,.pv-table td{border:1px solid var(--border);padding:5px 10px;text-align:left;max-width:360px;overflow:hidden;text-overflow:ellipsis}
.pv-table th{background:var(--panel2);color:var(--text);font-weight:600;position:sticky;top:0}
.pv-table td{color:#c8c8cf}
.pv-table tr:nth-child(even) td{background:rgba(255,255,255,0.02)}
.pv-table-note{color:var(--dimmer);font-size:11.5px;padding:6px 2px}
.pv-md{padding:16px 20px}
#pvbody iframe{width:100%;flex:1;border:none;background:#fff}
#pvbody img{max-width:92%;display:block;margin:20px auto}
.tree{padding:10px 8px;font-size:12.5px}
.tree .dir{color:var(--dim);padding:5px 8px 2px;font-weight:600}
.tree-folder{margin:2px 0 6px}
.tree-folder-head{width:100%;display:flex;align-items:center;gap:6px;padding:7px 8px;border:0;border-radius:6px;background:transparent;color:var(--dim);font:600 12px var(--sans);text-align:left;cursor:pointer}
.tree-folder-head:hover{background:#f1f5f9;color:var(--text)}
.tree-folder-head .arrow{width:14px;color:var(--dimmer);transition:transform .15s}
.tree-folder-head[aria-expanded="true"] .arrow{transform:rotate(90deg)}
.tree-folder-body.collapsed{display:none}
.tree .fil{display:flex;align-items:center;gap:8px;padding:3px 8px;border-radius:6px;font-family:var(--mono);font-size:12px}
.tree .fil:hover{background:#232327}
.tree .fil .fname{flex:1;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tree .fil .fchk{flex:none;cursor:pointer;margin:0}
.tree .fil .sz{color:var(--dimmer);flex:none}
.tree-tools{display:flex;align-items:center;gap:10px;padding:8px 10px 2px;font-size:12px;color:var(--dim)}
.tree-tools label{display:flex;align-items:center;gap:5px;cursor:pointer}
.tree-tools .tree-count{color:var(--dimmer)}
.tree-tools .tree-act{margin-left:auto;background:#1f6feb;color:#fff;border:none;border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer}
.tree-tools .tree-act:hover{background:#2b7bf5}
.tree-tools .tree-act:disabled{opacity:.6;cursor:default}
.pv-empty{color:var(--dimmer);text-align:center;padding:40px 20px;font-size:13px;line-height:1.7}
.path.link{cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
.history-section{flex:none;display:flex;flex-direction:column}
#tasklist{flex:none;max-height:260px;overflow-y:auto}
.sidebar-section-toggle{display:flex;align-items:center;justify-content:space-between;margin:4px 12px 6px;padding:9px 10px;border:1px solid var(--border);border-radius:8px;background:var(--panel2);color:var(--dim);font-size:12px;text-align:left}
.sidebar-section-toggle:hover{background:#f1f5f9;color:var(--text)}
.sidebar-section-toggle .arrow{transition:transform .15s}
.sidebar-section-toggle[aria-expanded="true"] .arrow{transform:rotate(180deg)}
#tasklist.collapsed{display:none}
#side-current-mission{display:none;flex:1 1 auto;min-height:0;overflow:hidden;flex-direction:column;border-top:1px solid var(--border);padding:10px 12px}
.side-current-title{font-size:11px;color:var(--dimmer);margin:0 4px 7px}
#side-missioninfo{display:flex;flex-direction:column;align-items:flex-start;gap:5px;width:100%;padding:9px 10px;border:1px solid #bfdbfe;border-radius:8px;background:#eff6ff;color:#1d4ed8;text-align:left}
#side-missioninfo:hover{background:#dbeafe}
#side-mission-label{font-size:12px;font-weight:600;line-height:1.4}
#side-mission-meta{font-size:10.5px;color:#64748b;line-height:1.4;word-break:break-all}
#side-missionbody{margin-top:8px;flex:1 1 auto;min-height:0;max-height:none;overflow:auto;padding:0 4px 2px}
#side-missionbody .mi-grid{grid-template-columns:86px 1fr;gap:5px 8px}
#side-missionbody .mi-grid .k{font-size:10.5px}
#side-missionbody .mi-grid .v{font-size:10.5px;line-height:1.45}
#side-missionbody .mi-grid .v .tag{font-size:10px;padding:1px 5px;margin-right:2px}
#side-missionbody .mi-sec{margin-top:9px;padding-top:8px}
#side-missionbody .mi-sec h4{font-size:10.5px;margin-bottom:5px}
#side-missionbody .mi-grid .k{min-width:0;overflow-wrap:anywhere;word-break:break-word;white-space:normal}
.mi-grid .v{color:var(--text)}

.modal{width:380px;background:#1c1c20;border:1px solid var(--border);border-radius:14px;padding:20px}
.modal h3{font-size:15px;margin-bottom:6px}
.modal .hint{font-size:12px;color:var(--dimmer);margin-bottom:14px}
.modal input{width:100%;background:#141416;border:1px solid var(--border);border-radius:8px;padding:9px 12px;font-size:13.5px;outline:none;margin-bottom:8px}
.modal input:focus{border-color:#4a4a52}

<script>
"use strict";
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

let META = null;          // /api/meta
let TASKS = [];           // task summaries
let ACTIVE = null;        // active task summary (id, project, ...)
let BUSY = false;
let SELECTED_PROJECT = null;

/* ---------------- tiny markdown ---------------- */
function md(src){
  const lines = String(src).split("\n");
  let html = "", i = 0, para = [];
  const inline = t => esc(t)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/\*([^*]+)\*/g, "<i>$1</i>")
    .replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  const flush = () => { if (para.length){ html += "<p>" + para.map(inline).join("<br>") + "</p>"; para = []; } };
  while (i < lines.length){
    const ln = lines[i];
    if (/^```/.test(ln)){
      flush();
      let code = []; i++;
      while (i < lines.length && !/^```/.test(lines[i])) code.push(lines[i++]);
      i++;
      html += "<pre><code>" + esc(code.join("\n")) + "</code></pre>";
      continue;
    }
    const h = ln.match(/^(#{1,3})\s+(.*)/);
    if (h){ flush(); const n = h[1].length; html += `<h${n}>` + inline(h[2]) + `</h${n}>`; i++; continue; }
    if (/^\s*[-*]\s+/.test(ln)){
      flush(); let items = [];
      while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) items.push(lines[i++].replace(/^\s*[-*]\s+/, ""));
      html += "<ul>" + items.map(x => "<li>" + inline(x) + "</li>").join("") + "</ul>";
      continue;
    }
    if (/^\s*\d+\.\s+/.test(ln)){
      flush(); let items = [];
      while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) items.push(lines[i++].replace(/^\s*\d+\.\s+/, ""));
      html += "<ol>" + items.map(x => "<li>" + inline(x) + "</li>").join("") + "</ol>";
      continue;
    }
    if (ln.trim() === "") { flush(); i++; continue; }
    para.push(ln); i++;
  }
  flush();
  return html;
}

/* ---------------- api helpers ---------------- */
async function api(path, opts){
  let r;
  try{
    r = await fetch(path, opts);
  }catch(e){
    return {error: `网络连接失败: ${e && e.message ? e.message : "无法连接服务"}`};
  }
  let body = null;
  try{ body = await r.json(); }catch(e){ body = {error: `接口返回异常(${r.status})`}; }
  if (!r.ok && !body.error) body.error = body.msg || `请求失败(${r.status})`;
  if (r.status === 401) body.error = body.error || "未获取到外部本体平台登录态，请从本体平台进入";
  return body;
}
async function loadMeta(){
  META = await api("/api/meta");
  if (!META || META.error){
    console.warn("加载服务元数据失败:", META && META.error);
    META = {sandbox:"sandbox/", projects:[], models:[], providers:[], params:{}, model:""};
    $("sbpath").textContent = META.sandbox;
    updateProjLabel(); updateModelLabels(); fillParamPanel();
    return;
  }
  $("sbpath").textContent = META.sandbox;
  if (!SELECTED_PROJECT && META.projects.length) SELECTED_PROJECT = META.projects[0].name;
  updateProjLabel(); updateModelLabels(); fillParamPanel();
}
async function loadTasks(){
  const q = (typeof MISSION !== "undefined" && MISSION)
    ? ("?" + new URLSearchParams({repositoryId: MISSION.repositoryId, taskCode: MISSION.taskCode}).toString()) : "";
  const j = await api("/api/tasks" + q);
  if (j.error){ console.warn("加载任务失败:", j.error); return; }
  TASKS = j.tasks || [];
  renderTaskList();
  if (MISSION && !ACTIVE && TASKS.length && !window._missionResumeAttempted){
    window._missionResumeAttempted = true;
    const key = `oc_active_task_${MISSION.repositoryId}_${MISSION.taskCode}`;
    const preferred = localStorage.getItem(key);
    const found = TASKS.find(t => t.id === preferred) || TASKS[0];
    if (found){
      await openTask(found.id);
      // 进入带任务 ID 的 Agent 页面时直接展示该任务项目已有文件。
      await showTree();
    }
  }
}

/* ---------------- sidebar ---------------- */
function relTime(ts){
  const d = Date.now()/1000 - ts;
  if (d < 60) return "刚刚";
  if (d < 3600) return Math.floor(d/60) + " 分钟前";
  if (d < 86400) return Math.floor(d/3600) + " 小时前";
  return Math.floor(d/86400) + " 天前";
}
function renderTaskList(){
  const box = $("tasklist");
  if (!TASKS.length){
    box.innerHTML = '<div class="empty-side">还没有任务。<br>选择一个项目开始吧。</div>';
    return;
  }
  box.innerHTML = "";
  for (const t of TASKS){
    const row = document.createElement("div");
    row.className = "task-row" + (ACTIVE && ACTIVE.id === t.id ? " active" : "");
    row.innerHTML =
      `<div class="t">${esc(t.title)}</div>` +
      `<div class="m"><span class="dot ${t.status === "working" ? "working" : t.status === "error" ? "error" : ""}"></span>` +
      `<span class="chip">${esc(t.project)}</span><span>${relTime(t.updated)}</span></div>`;
    row.onclick = () => openTask(t.id);
    box.appendChild(row);
  }
}

/* ---------------- views ---------------- */
function showHome(){
  ACTIVE = null;
  $("home").style.display = "flex";
  $("taskview").style.display = "none";
  $("taskview").classList.remove("empty-task");
  closePreview();
  renderTaskList();
  updateHomeSendButton();
  $("input").focus();
}
async function openTask(id){
  const t = await api("/api/tasks/" + id);
  if (t.error) return;
  ACTIVE = t;
  if (MISSION && t.repositoryId === MISSION.repositoryId && t.taskCode === MISSION.taskCode){
    localStorage.setItem(`oc_active_task_${MISSION.repositoryId}_${MISSION.taskCode}`, t.id);
  }
  $("home").style.display = "none";
  $("taskview").style.display = "flex";
  $("headtitle").textContent = t.title;
  $("headproj").textContent = t.project;
  setWorking(t.status === "working");
  const col = $("feedcol");
  col.innerHTML = "";
  toolCards = {}; approvalCards = {};
  streamEl = null;
  for (const ev of (t.log || [])) appendEvent(ev, col);
  // 服务端会结合恢复后的 Conversation.messages 判断旧任务是否真正开始过；
  // 只有兼容旧服务器时才回退到网页日志，且工具卡片本身不算已开始对话。
  ACTIVE.hasConversation = typeof t.hasConversation === "boolean"
    ? t.hasConversation
    : (t.log || []).some(ev => ev && ["user", "assistant", "text"].includes(ev.type)
        && String(ev.text || "").trim());
  updateTaskSendButton();
  renderTaskList();
  scrollFeed(true);
  if (previewOpen()) showTree();   // panel follows the task's project
  $("input2").focus();
}
function setWorking(on){
  $("headspin").classList.toggle("on", on);
  $("headdot").className = "dot" + (on ? " working" : "");
  $("sendbtn2").disabled = on;
}
function updateTaskSendButton(){
  const b = $("sendbtn2");
  if (!b) return;
  updateTaskLayout();
  const empty = !!ACTIVE && !ACTIVE.hasConversation && !$("input2").value.trim();
  b.classList.toggle("start-mode", empty);
  b.textContent = empty ? missionStartLabel() : "↑";
  b.title = empty ? "直接开始当前任务" : "发送";
}
function updateTaskLayout(){
  const view = $("taskview");
  if (view) view.classList.toggle("empty-task", !!ACTIVE && !ACTIVE.hasConversation);
  scheduleComposerLayout();
}

/* 输入区自适应：不滚动按钮行。空任务优先扩大卡片；空间仍不足时，
 * 按 data-compact-level 从小按钮到大按钮依次收起文字，发送按钮永远保留。 */
let composerLayoutFrame = 0;
function rowContentWidth(row){
  const items = [...row.children].filter(el => getComputedStyle(el).display !== "none");
  if (!items.length) return 0;
  const gap = parseFloat(getComputedStyle(row).gap) || 0;
  return items.reduce((sum, el) => sum + el.getBoundingClientRect().width, 0) + gap * (items.length - 1);
}
function fitComposerRow(row, composer){
  row.dataset.compact = "0";
  const pad = (parseFloat(getComputedStyle(composer).paddingLeft) || 0) +
              (parseFloat(getComputedStyle(composer).paddingRight) || 0);
  const available = Math.max(0, composer.clientWidth - pad);
  const levels = [...row.querySelectorAll(".compactable[data-compact-level]")]
    .map(el => Number(el.dataset.compactLevel)).filter(Number.isFinite);
  const maxLevel = levels.length ? Math.max(...levels) : 0;
  let level = 0;
  while (level < maxLevel && rowContentWidth(row) > available){
    level += 1;
    row.dataset.compact = String(level);
  }
  return {level, required: rowContentWidth(row), available};
}
function syncComposerLayout(){
  composerLayoutFrame = 0;
  document.querySelectorAll(".composer").forEach(composer => {
    const row = composer.querySelector(".crow");
    if (!row) return;
    const isHome = !!composer.closest("#home");
    const isCenteredTask = !!composer.closest("#taskview.empty-task");
    if (isHome || isCenteredTask){
      // 720px remains the default. If the full text labels need more room,
      // expand the centered card up to the usable home width before compacting.
      composer.style.width = "100%";
      composer.style.maxWidth = "720px";
      row.dataset.compact = "0";
      const pad = (parseFloat(getComputedStyle(composer).paddingLeft) || 0) +
                  (parseFloat(getComputedStyle(composer).paddingRight) || 0);
      const host = composer.closest("#home") || composer.closest("#taskview.empty-task");
      const hostAvailable = Math.max(0, host.clientWidth - (isHome ? 48 : 44));
      const required = rowContentWidth(row) + pad;
      if (required > composer.clientWidth && hostAvailable > composer.clientWidth){
        const target = Math.min(hostAvailable, required);
        composer.style.width = target + "px";
        composer.style.maxWidth = hostAvailable + "px";
      }
    } else {
      // A completed conversation uses the normal bottom composer width; only
      // the centered first-run composer is allowed to expand the card.
      composer.style.width = "100%";
      composer.style.maxWidth = "720px";
    }
    fitComposerRow(row, composer);
  });
}
function scheduleComposerLayout(){
  if (composerLayoutFrame) cancelAnimationFrame(composerLayoutFrame);
  composerLayoutFrame = requestAnimationFrame(syncComposerLayout);
}
window.addEventListener("resize", scheduleComposerLayout);
function missionStartLabel(){
  return MISSION && MISSION.taskType === "integration"
    ? "开始智能消歧与整合" : "开始智能建模";
}
function updateHomeSendButton(){
  const b = $("sendbtn");
  if (!b) return;
  const empty = !!MISSION && !$("input").value.trim();
  b.classList.toggle("start-mode", empty);
  b.textContent = empty ? missionStartLabel() : "↑";
  b.title = empty ? "直接开始当前任务" : "发送";
}
function scrollFeed(force){
  const f = $("feed");
  const near = f.scrollHeight - f.scrollTop - f.clientHeight < 160;
  if (force || near) f.scrollTop = f.scrollHeight;
}

/* ---------------- event rendering (replay + live share this) ---------------- */
let toolCards = {};       // tool_use_id -> {card, body, kind}
let approvalCards = {};   // approval id -> card element
let streamEl = null;      // live-streaming assistant text element
let streamBuf = "";

function toolMeta(name, input){
  input = input || {};
  const p = input.file_path || input.path || "";
  switch (name){
    case "Bash": return {ic:"❯", lbl:"运行命令", path:(input.command||"").slice(0,80), kind:"bash"};
    case "Read": return {ic:"📄", lbl:"读取", path:p, kind:"plain"};
    case "Write": return {ic:"✚", lbl:"创建文件", path:p, kind:"write"};
    case "Edit": return {ic:"±", lbl:"编辑", path:p, kind:"edit"};
    case "Glob": return {ic:"🔍", lbl:"查找文件", path:input.pattern||"", kind:"plain"};
    case "Grep": return {ic:"🔍", lbl:"搜索", path:input.pattern||"", kind:"plain"};
    case "Skill": return {ic:"✦", lbl:"技能 /" + (input.skill||""), path:input.args||"", kind:"plain"};
    case "Agent": return {ic:"🤖", lbl:"子智能体", path:(input.description||""), kind:"plain"};
    default: return {ic:"⚙", lbl:name, path:"", kind:"json"};
  }
}

function diffHTML(oldS, newS){
  let h = "";
  if (oldS) for (const l of String(oldS).split("\n")) h += `<div class="ln del">- ${esc(l)}</div>`;
  if (newS) for (const l of String(newS).split("\n")) h += `<div class="ln add">+ ${esc(l)}</div>`;
  return h;
}

/* 把消息里出现的文件名(如 数据.csv)变成可点击链接,点击后在右侧预览 */
const FILE_REF_RE = /(?:[\w\-.一-鿿()]+[\/\\])*[\w\-.一-鿿()]+\.(?:csv|tsv|xlsx?|docx?|pdf|md|html?|json|txt|py|js|ts|sql|ya?ml|xml|log|png|jpe?g|gif|svg|webp)\b/gi;
function normalizeFileRef(p){
  p = String(p).replace(/\\/g, "/");
  const proj = pvProject();
  if (proj){
    const key = "sandbox/" + proj + "/";
    const i = p.indexOf(key);
    if (i >= 0) return p.slice(i + key.length);   // 绝对路径/带 sandbox 前缀 -> 项目内相对路径
  }
  return p;
}
function linkifyFiles(root){
  if (!root) return;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode(n){
      return n.parentElement && n.parentElement.closest("a,.filelink")
        ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT;
    }
  });
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  for (const node of nodes){
    const text = node.nodeValue;
    FILE_REF_RE.lastIndex = 0;
    if (!FILE_REF_RE.test(text)) continue;
    FILE_REF_RE.lastIndex = 0;
    const frag = document.createDocumentFragment();
    let last = 0, m;
    while ((m = FILE_REF_RE.exec(text))){
      frag.appendChild(document.createTextNode(text.slice(last, m.index)));
      const s = document.createElement("span");
      s.className = "filelink";
      s.textContent = m[0];
      s.title = "在右侧预览";
      const ref = m[0];
      s.onclick = e => { e.stopPropagation(); openFile(normalizeFileRef(ref)); };
      frag.appendChild(s);
      last = m.index + m[0].length;
    }
    frag.appendChild(document.createTextNode(text.slice(last)));
    node.parentNode.replaceChild(frag, node);
  }
}

function appendEvent(ev, col){
  col = col || $("feedcol");
  if (ev.type === "user"){
    closeStream();
    const d = document.createElement("div");
    d.className = "msg-user"; d.textContent = publicUserText(ev.text);
    col.appendChild(d);
  }
  else if (ev.type === "assistant"){          // coalesced block from replay
    closeStream();
    const d = document.createElement("div");
    d.className = "msg-asst"; d.innerHTML = md(ev.text);
    linkifyFiles(d);
    col.appendChild(d);
  }
  else if (ev.type === "text"){                // live delta
    if (!streamEl){
      streamEl = document.createElement("div");
      streamEl.className = "msg-asst"; streamBuf = "";
      col.appendChild(streamEl);
    }
    streamBuf += ev.text;
    streamEl.innerHTML = md(streamBuf);
  }
  else if (ev.type === "thinking"){
    let el = col.lastElementChild;
    if (!el || !el.classList.contains("think")){
      el = document.createElement("div");
      el.className = "think"; el.dataset.buf = "";
      el.onclick = () => el.classList.toggle("open");
      closeStream(); col.appendChild(el);
    }
    el.dataset.buf += ev.text;
    el.textContent = el.dataset.buf;
  }
  else if (ev.type === "audit"){
    closeStream();
    const d = document.createElement("div");
    d.className = "audit" + (ev.severity === "warning" ? " warning" : "");
    d.innerHTML = `<span class="audit-title">🔎 ${esc(ev.title || "执行审计")}</span>${esc(ev.detail || "")}`;
    col.appendChild(d);
  }
  else if (ev.type === "tool_use"){
    closeStream();
    const m = toolMeta(ev.name, ev.input);
    const card = document.createElement("div");
    card.className = "tool";
    card.innerHTML =
      `<div class="thead"><span class="ic">${m.ic}</span><span class="lbl">${esc(m.lbl)}</span>` +
      `<span class="path">${esc(m.path)}</span><span class="st run">●</span></div>` +
      `<div class="tbody"></div>`;
    const body = card.querySelector(".tbody");
    card.querySelector(".thead").onclick = () => card.classList.toggle("open");
    const inp = ev.input || {};
    if (m.kind === "bash"){
      body.innerHTML = `<div class="term"><span class="cmd">$ ${esc(inp.command||"")}</span>\n<span class="out"></span></div>`;
      linkifyFiles(body.querySelector(".cmd"));
      card.classList.add("open");
    } else if (m.kind === "edit"){
      body.innerHTML = `<div class="diff">${diffHTML(inp.old_string, inp.new_string)}</div><div class="term" style="display:none"><span class="out"></span></div>`;
      card.classList.add("open");
    } else if (m.kind === "write"){
      body.innerHTML = `<div class="diff">${diffHTML("", inp.content)}</div><div class="term" style="display:none"><span class="out"></span></div>`;
      card.classList.add("open");
    } else if (m.kind === "json"){
      body.innerHTML = `<div class="term"><span class="cmd">${esc(JSON.stringify(inp, null, 2))}</span>\n<span class="out"></span></div>`;
    } else {
      body.innerHTML = `<div class="term"><span class="out"></span></div>`;
    }
    if (inp.file_path && ["Read", "Write", "Edit"].includes(ev.name)){
      const pathEl = card.querySelector(".path");
      pathEl.classList.add("link");
      pathEl.title = "在右侧预览";
      pathEl.onclick = e => { e.stopPropagation(); openFile(inp.file_path); };
    }
    col.appendChild(card);
    if (ev.id) toolCards[ev.id] = card;
  }
  else if (ev.type === "tool_result"){
    const card = toolCards[ev.tool_use_id];
    if (card){
      const st = card.querySelector(".st");
      st.className = "st " + (ev.is_error ? "err" : "ok");
      st.textContent = ev.is_error ? "失败" : "完成";
      const out = card.querySelector(".out");
      if (out){
        const text = ev.content || "";
        out.textContent = text.length > 6000 ? text.slice(0, 6000) + "\n… (已截断)" : text;
        linkifyFiles(out);
        if (ev.is_error){ out.className = "errout"; out.parentElement.style.display = ""; card.classList.add("open"); }
      }
    }
  }
  else if (ev.type === "approval_request"){
    closeStream();
    const card = document.createElement("div");
    card.className = "appr";
    card.dataset.approvalId = ev.id || "";
    card.innerHTML =
      `<div class="ahead">⚠ 需要确认:${esc(ev.summary || ev.tool)}</div>` +
      (ev.detail ? `<pre class="adetail">${esc(ev.detail)}</pre>` : "") +
      `<div class="abtns"><button class="aok">允许执行</button><button class="ano">拒绝</button><span class="ast"></span></div>`;
    const st = card.querySelector(".ast");
    const send = async (approved) => {
      card.querySelectorAll("button").forEach(b => b.disabled = true);
      st.textContent = "已提交…";
      try{
        const j = await api(`/api/tasks/${ACTIVE.id}/approve`, {method:"POST",
          headers:{"Content-Type":"application/json"},
          body: JSON.stringify({id: ev.id, approved})});
        if (j.error){ st.textContent = j.error; card.querySelectorAll("button").forEach(b => b.disabled = false); }
      }catch(e){
        st.textContent = "提交失败,请重试";
        card.querySelectorAll("button").forEach(b => b.disabled = false);
      }
    };
    card.querySelector(".aok").onclick = () => send(true);
    card.querySelector(".ano").onclick = () => send(false);
    approvalCards[ev.id] = card;
    col.appendChild(card);
    scrollFeed(true);
    if (AUTO_APPROVE){           // 开关打开:自动允许,跳过人工确认
      st.textContent = "⚡ 自动确认已开,自动允许…";
      send(true);
    }
  }
  else if (ev.type === "approval_result"){
    const card = approvalCards[ev.id];
    if (card){
      const btns = card.querySelector(".abtns");
      if (btns) btns.innerHTML = ev.approved
        ? '<span class="ares yes">✓ 已允许,继续执行</span>'
        : `<span class="ares no">✕ ${ev.timeout ? "确认超时,已跳过该操作" : "已拒绝该操作"}</span>`;
      card.classList.add("done");
    }
  }
  else if (ev.type === "model_switch"){
    closeStream();
    if (META && ev.to){ META.model = ev.to; updateModelLabels(); }
    const d = document.createElement("div");
    d.className = "done-note";
    d.textContent = `当前模型额度不足,已自动切换到 ${ev.to || "同类模型"}`;
    col.appendChild(d);
  }
  else if (ev.type === "error"){
    closeStream();
    const d = document.createElement("div");
    d.className = "msg-err"; d.textContent = ev.error;
    col.appendChild(d);
  }
  scrollFeed(false);
}

  }

async function sendToActive(text, displayText){
  if (MISSION){
    try{ await ensureMissionContext(); }catch(e){ /* 对话仍可继续,系统会保留当前 ID */ }
  }
  BUSY = true; setWorking(true);
  if (ACTIVE){ ACTIVE.hasConversation = true; updateTaskSendButton(); }
  displayText = displayText || text;
  appendEvent({type:"user", text: displayText});
  scrollFeed(true);
  let serverStatus = null;
  let requestFailed = false;
  try{
    const r = await fetch(`/api/tasks/${ACTIVE.id}/send`, {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({message: text, displayMessage: displayText,
        missionContext: MISSION ? MISSION_CONTEXT : null}),
    });
    if (!r.ok || !r.body){
      let msg = `请求失败(${r.status})`;
      try{ const j = await r.json(); msg = j.error || j.msg || msg; }catch(e){}
      throw new Error(msg);
    }
    const reader = r.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    while (true){
      const {done, value} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream:true});
      let idx;
      while ((idx = buf.indexOf("\n\n")) >= 0){
        const chunk = buf.slice(0, idx); buf = buf.slice(idx + 2);
        for (const line of chunk.split("\n")){
          if (!line.startsWith("data: ")) continue;
          let ev; try{ ev = JSON.parse(line.slice(6)); }catch(e){ continue; }
          if (ev.type === "done"){
            serverStatus = ev.status || null;
            closeStream();
            if (ev.cost > 0){
              const n = document.createElement("div");
              n.className = "done-note";
              n.textContent = `本轮完成 · ${ev.model} · 累计 $${ev.cost}`;
              $("feedcol").appendChild(n);
            }
          } else {
            appendEvent(ev);
          }
        }
      }
    }
  }catch(e){
    requestFailed = true;
    appendEvent({type:"error", error:"连接中断: " + e.message});
  }finally{
    closeStream();
    BUSY = false; setWorking(false);
    if (serverStatus === "error" || requestFailed) $("headdot").className = "dot error";
    if (ACTIVE){
      const t = TASKS.find(x => x.id === ACTIVE.id);
      if (t){
        t.title = $("headtitle").textContent;
        t.updated = Date.now()/1000;
        t.status = serverStatus === "error" ? "error" : "idle";
      }
    }
    renderTaskList();
    scrollFeed(false);
    if (previewOpen()){
      if (PV.mode === "tree") showTree();                 // pick up new files
    } else {
      // 任务完成后若项目里已有产出文件,自动打开右侧文件区
      const proj = pvProject();
      if (proj){
        try{
          const j = await api(filesAPIPath(proj));
          if ((j.files || []).length) showTree();
        }catch(e){}
      }
    }
  }
}

function readB64(file){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(String(r.result).split(",")[1] || "");
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}
async function uploadPending(project){
  const names = [];
  for (const f of PENDING_FILES){
    if (f.size > 20 * 1024 * 1024){ alert(`${f.name} 超过 20MB,已跳过`); continue; }
    try{
      const data = await readB64(f);
      const payload = {project, name: f.name, data};
      if (MISSION){
        payload.repositoryId = MISSION.repositoryId;
        payload.taskCode = MISSION.taskCode;
        if (ACTIVE && ACTIVE.id) payload.taskId = ACTIVE.id;
        if (MISSION.taskType) payload.taskType = MISSION.taskType;
      }
      const j = await api("/api/upload", {method:"POST", headers:{"Content-Type":"application/json"},
                                          body: JSON.stringify(payload)});
      if (j.ok) names.push(j.name); else alert(f.name + " 上传失败: " + (j.error || ""));
    }catch(e){ alert(f.name + " 上传失败: " + e.message); }
  }
  PENDING_FILES = []; renderChips();
  return names;
}

/* Agent 消息里经常只返回输出文件名,而实际文件位于任务输出目录。
 * 预览首次 404 时,在当前项目文件清单中按完整路径/后缀/唯一文件名兜底定位。 */
async function findPreviewPath(proj, rel){
  const wanted = String(rel || "").replace(/\\/g, "/").replace(/^\/+/, "");
  try{
    const j = await api(filesAPIPath(proj));
    const files = (j.files || []).map(f => f.path).filter(Boolean);
    if (files.includes(wanted)) return wanted;
    const suffix = files.filter(p => p.endsWith("/" + wanted));
    if (suffix.length === 1) return suffix[0];
    const name = wanted.split("/").pop().toLowerCase();
    const sameName = files.filter(p => p.split("/").pop().toLowerCase() === name);
    if (sameName.length === 1) return sameName[0];
  }catch(e){ /* 保留原始路径,让下方显示标准错误 */ }
  return wanted;
}

/* CSV/TSV -> 表格预览(支持引号包裹字段) */
function parseCSV(text, sep){
  const rows = []; let row = [], cur = "", inQ = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (inQ){
      if (c === '"'){ if (text[i+1] === '"'){ cur += '"'; i++; } else inQ = false; }
      else cur += c;
    }
    else if (c === '"') inQ = true;
    else if (c === sep){ row.push(cur); cur = ""; }
    else if (c === "\n"){ row.push(cur); rows.push(row); row = []; cur = ""; }
    else if (c !== "\r") cur += c;
  }
  if (cur !== "" || row.length){ row.push(cur); rows.push(row); }
  return rows;
}
function csvTableHTML(text, sep){
  const MAX_ROWS = 500;
  const rows = parseCSV(text, sep).filter(r => r.length > 1 || (r[0] || "").trim() !== "");
  if (!rows.length) return '<div class="pv-empty">空文件</div>';
  const head = rows[0], body = rows.slice(1, 1 + MAX_ROWS);
  let h = '<div class="pv-table-wrap"><table class="pv-table"><thead><tr>';
  h += head.map(c => `<th>${esc(c)}</th>`).join("") + "</tr></thead><tbody>";
  for (const r of body){
    h += "<tr>" + head.map((_, i) => `<td>${esc(r[i] == null ? "" : r[i])}</td>`).join("") + "</tr>";
  }
  h += "</tbody></table>";
  const total = rows.length - 1;
  h += `<div class="pv-table-note">${total} 行 × ${head.length} 列` +
       (total > MAX_ROWS ? ` · 仅显示前 ${MAX_ROWS} 行(点「源码」看全文)` : "") + "</div></div>";
  return h;
}

async function showTree(){
  const proj = pvProject();
  if (!proj) return;
  $("preview").classList.add("open");
  setPreviewResizer();
  PV.mode = "tree"; PV.file = null;
  $("pvback").style.display = "none";
  $("pvsrc").style.display = "none";
  $("pvopen").style.display = "none";
  $("pvdl").style.display = "";
  $("pvdl").onclick = downloadSelected;
  $("pvtitle").textContent = proj + " / 项目文件";
  const j = await api(filesAPIPath(proj));
  const files = j.files || [];
  const body = $("pvbody");
  if (!files.length){
    $("pvdl").style.display = "none";
    body.innerHTML = '<div class="pv-empty">项目还是空的。<br>让智能体生成一些文件,或用 📎 上传。</div>';
    return;
  }
  files.sort((a, b) => {
    const da = a.path.slice(0, a.path.lastIndexOf("/") + 1);
    const db = b.path.slice(0, b.path.lastIndexOf("/") + 1);
    return da.localeCompare(db) || a.path.localeCompare(b.path);
  });
  let html = '<div class="tree-tools"><label><input type="checkbox" id="chkall"> 全选</label>' +
             '<span id="chkcount" class="tree-count"></span>' +
             (MISSION ? '<button class="tree-act" id="btnminio">上传到 MinIO</button>' : '') +
             '</div><div class="tree">';
  const groups = new Map();
  for (const f of files){
    const i = f.path.lastIndexOf("/");
    const dir = i < 0 ? "" : f.path.slice(0, i);
    if (!groups.has(dir)) groups.set(dir, []);
    groups.get(dir).push(f);
  }
  // 即使当前没有直接放在根目录的文件，也保留“项目根目录”入口；
  // 这样只有 mission-input/mission-output 子目录时也能看到项目根目录。
  if (!groups.has("")) groups.set("", []);
  const dirs = [...groups.keys()].sort((a, b) => {
    if (!a) return -1;
    if (!b) return 1;
    return a.localeCompare(b);
  });
  let missingNotice = "";
  const expectedMissionFiles = missionExpectedFiles();
  if (expectedMissionFiles.length){
    const actual = new Set(files.map(f => String(f.path || "").split("/").pop()));
    const missing = expectedMissionFiles.filter(n => !actual.has(n));
    if (missing.length)
      missingNotice = `<div class="pv-empty" style="margin:8px 0;color:#9a6700;background:#fff8e1">` +
        `任务声明的输出文件尚未在当前项目中找到：${esc(missing.join("、"))}。Agent 只能在文件实际存在后报告完成。</div>`;
  }
  for (const dir of dirs){
    const groupId = "folder-" + (dir || "root").replace(/[^a-zA-Z0-9_-]/g, "_");
    const open = !!dir; // 根目录通常是工作杂项,任务/ID 子目录默认展开
    const folderLabel = dir === "mission-input" ? "📥 输入文件" :
      dir === "mission-output" ? "📤 输出文件" :
      `📁 ${esc(dir || "项目根目录")}${dir ? "/" : ""}`;
    html += `<section class="tree-folder"><button class="tree-folder-head" data-folder="${esc(groupId)}" aria-expanded="${open}"><span class="arrow">▶</span><span>${folderLabel}</span><span class="tree-count">(${groups.get(dir).length})</span></button><div class="tree-folder-body${open ? "" : " collapsed"}" data-folder-body="${esc(groupId)}">`;
    for (const f of groups.get(dir)){
      const i = f.path.lastIndexOf("/");
      const name = i < 0 ? f.path : f.path.slice(i + 1);
      html += `<div class="fil" data-p="${esc(f.path)}"><input type="checkbox" class="fchk" data-p="${esc(f.path)}"><span class="fname">${esc(name)}</span><span class="sz">${fmtSize(f.size)}</span></div>`;
    }
    html += "</div></section>";
  }
  body.innerHTML = missingNotice + html + "</div>";
  body.querySelectorAll(".tree-folder-head").forEach(head => head.onclick = () => {
    const open = head.getAttribute("aria-expanded") === "true";
    head.setAttribute("aria-expanded", String(!open));
    const panel = body.querySelector(`[data-folder-body="${head.dataset.folder}"]`);
    if (panel) panel.classList.toggle("collapsed", open);
  });
  body.querySelectorAll(".fname").forEach(el =>
    el.onclick = () => openFile(el.parentElement.dataset.p));
  const chks = [...body.querySelectorAll(".fchk")];
  const updateCount = () => {
    const n = chks.filter(c => c.checked).length;
    $("chkcount").textContent = n ? n + " 个已选" : "";
    $("chkall").checked = n === chks.length;
  };
  chks.forEach(c => c.onclick = e => { e.stopPropagation(); updateCount(); });
  $("chkall").onclick = () => { chks.forEach(c => c.checked = $("chkall").checked); updateCount(); };
  if ($("btnminio")) $("btnminio").onclick = uploadSelectedToMinio;
}

async function uploadSelectedToMinio(){
  const proj = pvProject();
  if (!proj) return;
  const picked = [...document.querySelectorAll("#pvbody .fchk:checked")].map(c => c.dataset.p);
  if (!picked.length){ alert("请先勾选要上传的文件"); return; }
  const btn = $("btnminio");
  const old = btn ? btn.textContent : "";
  if (btn){ btn.disabled = true; btn.textContent = "上传中…"; }
  try{
    const prefix = await getMissionPrefix();
    if (!prefix){ alert("未获取到任务的输出路径前缀(outputPrefix)"); return; }
    const body = {project: proj, paths: picked, prefix,
      taskCode: MISSION.taskCode, repositoryId: MISSION.repositoryId,
      parseElements: MISSION_CONTEXT && MISSION_CONTEXT.parseElements || [],
      expectedFiles: MISSION_CONTEXT && MISSION_CONTEXT.expectedFiles || []};
    if (ACTIVE && ACTIVE.id) body.taskId = ACTIVE.id;
    if (MISSION.taskType) body.taskType = MISSION.taskType;
    const j = await api("/api/minio/upload", {method:"POST", body: JSON.stringify(body)});
    if (j.error){ alert("上传失败:" + j.error); return; }
    const fails = (j.results || []).filter(r => !r.ok);
    let msg = `已上传 ${j.uploaded}/${j.total} 个文件到\n${j.bucket}/${j.prefix}/`;
    if (fails.length) msg += "\n\n失败:\n" + fails.map(r => `· ${r.name}: ${r.error}`).join("\n");
    if (j.callback){
      if (j.callback.ok) msg += `\n\n✅ 已回写报告(callback):上报 ${j.callback.reported} 个文件,类型 ${j.callback.kind}`;
      else if (j.callback.skipped) msg += `\n\n⚠️ 未回写报告:${j.callback.error}`;
      else msg += `\n\n❌ 回写报告失败:${j.callback.error}`;
    }
    alert(msg);
  }catch(e){ alert("上传失败:" + e.message); }
  finally{ if (btn){ btn.disabled = false; btn.textContent = old; } }
}

function downloadFiles(proj, rels){

      + "&taskCode=" + encodeURIComponent(MISSION.taskCode)
      + "&taskType=" + encodeURIComponent(MISSION.taskType || "")
      + "&taskId=" + encodeURIComponent(ACTIVE && ACTIVE.id || "");

async function openFile(rel){
  const proj = pvProject();
  if (!proj || !rel) return;
  $("preview").classList.add("open");
  PV.mode = "file";
  if (PV.file !== rel) PV.showSrc = false;
  PV.file = rel;
  $("pvback").style.display = "";
  $("pvtitle").textContent = rel;
  let url = fileURL(proj, rel);
  const ext = extOf(rel);
  const body = $("pvbody");
  const canSrc = ext === "html" || ext === "htm" || ext === "md" || ext === "csv" || ext === "tsv";
  $("pvsrc").style.display = canSrc ? "" : "none";
  $("pvsrc").textContent = PV.showSrc ? "预览" : "源码";
  const openable = ext === "html" || ext === "htm" || ext === "pdf" || IMG_EXT.has(ext);
  $("pvopen").style.display = openable ? "" : "none";
  $("pvopen").onclick = () => window.open(url, "_blank");
  $("pvdl").style.display = "";
  $("pvdl").onclick = () => downloadFiles(proj, [rel]);
  if (!canSrc) PV.showSrc = false;

  if (IMG_EXT.has(ext)){ body.innerHTML = `<img src="${url}" alt="">`; return; }
  if (ext === "pdf"){ body.innerHTML = `<iframe src="${url}"></iframe>`; return; }
  if ((ext === "html" || ext === "htm") && !PV.showSrc){
    body.innerHTML = `<iframe src="${url}" sandbox="allow-scripts"></iframe>`;
    return;
  }
  let r;
  try{ r = await fetch(url); }catch(e){ body.innerHTML = `<div class="pv-empty">加载失败</div>`; return; }
  if (!r.ok){
    const fallback = await findPreviewPath(proj, rel);
    if (fallback && fallback !== rel){
      rel = fallback; PV.file = rel; url = fileURL(proj, rel);
      r = await fetch(url);
    }
    if (!r.ok){ body.innerHTML = `<div class="pv-empty">无法打开文件(${r.status})</div>`; return; }
  }
  const buf = await r.arrayBuffer();
  if (buf.byteLength > 1500000){
    body.innerHTML = `<div class="pv-empty">文件太大(${fmtSize(buf.byteLength)}),不在此预览。</div>`;
    return;
  }
  let text;
  try{ text = new TextDecoder("utf-8", {fatal:true}).decode(buf); }
  catch(e){
    try{ text = new TextDecoder("gbk", {fatal:true}).decode(buf); }   // 中文 Windows 常见编码
    catch(e2){
      body.innerHTML = `<div class="pv-empty">二进制文件(${fmtSize(buf.byteLength)}),无法预览。</div>`;
      return;
    }
  }
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);            // strip BOM
  if (ext === "md" && !PV.showSrc){
    body.innerHTML = `<div class="pv-md msg-asst">${md(text)}</div>`;
    return;
  }
  if ((ext === "csv" || ext === "tsv") && !PV.showSrc){
    body.innerHTML = csvTableHTML(text, ext === "tsv" ? "\t" : ",");
    return;
  }
  const lines = text.split("\n");
  body.innerHTML = `<div class="pv-code">${lines.map((l, i) => `<span class="no">${i + 1}</span>${esc(l)}`).join("\n")}</div>`;
}

/* 取任务的 outputPrefix:已缓存直接返回,否则拉一次任务信息。*/
async function getMissionPrefix(){
  if (MISSION_PREFIX) return MISSION_PREFIX;
  if (!MISSION) return null;
  const q = new URLSearchParams({
    repositoryId: MISSION.repositoryId, taskCode: MISSION.taskCode,
  });
  if (MISSION.taskType) q.set("taskType", MISSION.taskType);
  const j = await api("/api/mission/task?" + q.toString());
  if (j && j.task && j.task.outputPrefix) MISSION_PREFIX = j.task.outputPrefix;
  return MISSION_PREFIX;
}

const MI_LABELS = {

  modelName:"模型名称", taskType:"任务类型", prompt:"提示词",
  parseElements:"解析要素", expectedFiles:"期望输出文件", outputPrefix:"输出路径前缀",

  dbType:"数据库类型", host:"主机", port:"端口", database:"数据库",
  username:"用户名", password:"密码", sourceSchema:"Schema",
  selectedTables:"选中数据表", databaseSourceId:"数据源 ID",
  fileSourceId:"文件源 ID", fileType:"文件类型", objectKey:"对象存储 Key",
  semanticSimilarityThreshold:"语义相似度阈值", items:"条目", mode:"模式",

  database:"数据源", document:"文档", sourceModels:"来源模型",
  integrationStrategy:"整合策略", validationRules:"校验规则",
};
const miLabel = k => MI_LABELS[k] || k;

function isPlainObj(v){ return v && typeof v === "object" && !Array.isArray(v); }

/* 把一个对象渲染成:标量/数组的键值表 + 每个嵌套对象一个小节 */
function renderObj(obj){
  let rows = "", sections = "";
  for (const [k, v] of Object.entries(obj)){
    if (v === null || v === undefined || v === "") continue;
    if (isPlainObj(v)){
      const title = MI_SECTION_LABELS[k] || miLabel(k);
      sections += `<div class="mi-sec"><h4>${esc(title)}</h4>${renderObj(v)}</div>`;
    } else if (Array.isArray(v)){
      const tags = v.map(x => isPlainObj(x)
        ? `<span class="tag">${esc(Object.values(x).join(" · "))}</span>`
        : `<span class="tag">${esc(x)}</span>`).join("");
      rows += `<div class="k">${esc(miLabel(k))}</div><div class="v">${tags || "—"}</div>`;
    } else {
      const shown = k === "password" ? "••••••••" : String(v);
      rows += `<div class="k">${esc(miLabel(k))}</div><div class="v">${esc(shown)}</div>`;
    }
  }
  return (rows ? `<div class="mi-grid">${rows}</div>` : "") + sections;
}

/* 可拖拽的三栏布局：默认尺寸沿用原页面，双击分隔条恢复默认值。 */
function setupColumnResizers(){
  const sidebar = $("sidebar");
  const preview = $("preview");
  const sideHandle = $("sidebar-resizer");
  const previewHandle = $("preview-resizer");
  if (!sidebar || !preview || !sideHandle || !previewHandle) return;
  const drag = (handle, target, direction, min, max, reset) => {
    handle.addEventListener("pointerdown", e => {
      e.preventDefault();
      const startX = e.clientX;
      const startWidth = target.getBoundingClientRect().width;
      handle.classList.add("dragging");
      document.body.style.cursor = "col-resize";
      document.body.style.userSelect = "none";
      const move = ev => {
        const delta = (ev.clientX - startX) * direction;
        const width = Math.max(min, Math.min(max, startWidth + delta));
        target.style.width = width + "px";
        target.style.minWidth = width + "px";
      };
      const done = () => {
        handle.classList.remove("dragging");
        document.body.style.cursor = "";
        document.body.style.userSelect = "";
        window.removeEventListener("pointermove", move);
        window.removeEventListener("pointerup", done);
      };
      window.addEventListener("pointermove", move);
      window.addEventListener("pointerup", done, {once: true});
    });
    handle.addEventListener("dblclick", reset);
  };
  drag(sideHandle, sidebar, 1, 180, 420, () => {
    sidebar.style.width = "264px"; sidebar.style.minWidth = "264px";
  });
  drag(previewHandle, preview, -1, 300, Math.floor(window.innerWidth * .7), () => {
    preview.style.width = "23%"; preview.style.minWidth = "300px";
  });
}

setupColumnResizers();

$("history-toggle").onclick = () => {
  const expanded = $("history-toggle").getAttribute("aria-expanded") === "true";
  $("history-toggle").setAttribute("aria-expanded", String(!expanded));
  $("tasklist").classList.toggle("collapsed", expanded);
};

(async function init(){
  await loadMeta();
  showHome();
  initMission();
  await loadTasks();
  setInterval(async () => { if (!BUSY) { await loadTasks(); } }, 20000);
})();
</script>

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "open-claude"
version = "0.5.0"
description = "Open Claude - AI coding assistant"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.42.0",
    "openai>=1.30.0",
    "rich>=13.0.0",
    "prompt_toolkit>=3.0.0",
    "pypdf>=5.0",
    "cryptography>=42.0",
]

[project.optional-dependencies]
# Needed by the ontology modeling database verification helper.
ontology = ["SQLAlchemy>=2.0", "psycopg2-binary>=2.9", "PyMySQL>=1.1", "oracledb>=2.0"]
# Needed by the shared execution coordinator's multi-instance Redis backend
# (TASKS_COORDINATOR_BACKEND=redis / MODELING_SERVER_COORDINATOR_BACKEND=redis).
redis = ["redis>=4.0"]

[tool.setuptools.packages.find]
include = ["open_claude*"]

[project.scripts]
open-claude = "open_claude.__main__:main"
